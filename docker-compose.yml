# Local and server stack. Same file on a Mac (Docker Desktop) and on the AWS host.
#
# Every port is published on 127.0.0.1 only, so nothing is reachable from outside
# the machine. On the server, reach the UIs through an SSH tunnel.
#
#   make up     the real endpoints
#   make demo   the real endpoints plus fake ones you can break (profile "demo")

services:
  bsc-pulse:
    build: .
    image: bsc-pulse:local
    restart: unless-stopped
    environment:
      BSC_PULSE_INTERVAL: ${BSC_PULSE_INTERVAL:-5}
      BSC_PULSE_TIMEOUT: ${BSC_PULSE_TIMEOUT:-3}
      # make demo adds config/endpoints.demo.yaml here
      BSC_PULSE_CONFIG: ${BSC_PULSE_CONFIG:-config/endpoints.yaml}
    ports:
      - "127.0.0.1:9105:9105"

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      # Links in alerts point here; it works through the SSH tunnel on the server.
      - --web.external-url=http://127.0.0.1:9090
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - bsc-pulse

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=http://127.0.0.1:9093
    volumes:
      - ./deploy/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"

  # Same image as the watchdog, different command.
  notifier:
    build: .
    image: bsc-pulse:local
    restart: unless-stopped
    command: ["python", "-m", "bsc_pulse.notifier"]
    environment:
      NOTIFIER_LISTEN: 0.0.0.0:9106
      PROMETHEUS_URL: http://prometheus:9090
      # Read from .env next to this file (git-ignored). Empty = dry run to the log.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    ports:
      - "127.0.0.1:9106:9106"
    depends_on:
      - bsc-pulse

  grafana:
    image: grafana/grafana:12.0.0
    restart: unless-stopped
    environment:
      # Required: `make up` refuses to start until .env sets it.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/bsc-pulse.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

  # Fake endpoints for demos. Only started with --profile demo (make demo).
  fake-rpc:
    build: .
    image: bsc-pulse:local
    profiles: [demo]
    restart: unless-stopped
    command:
      ["python", "-m", "bsc_pulse.fake_rpc", "--host", "0.0.0.0", "--ports", "18545,18546,18547"]
    ports:
      - "127.0.0.1:18545-18547:18545-18547"

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
