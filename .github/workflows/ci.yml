name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# Runners are pinned to Ubuntu 24.04 instead of ubuntu-latest. When GitHub moved
# ubuntu-latest to 26.04, Python 3.9 (end of life, no builds for 26.04) broke the
# 3.9 job. A pinned runner only changes when we change it.

jobs:
  checks:
    runs-on: ubuntu-24.04
    strategy:
      # Report every Python version, instead of cancelling the others on the first failure.
      fail-fast: false
      matrix:
        # 3.9 is the default python3 on macOS; 3.12 is what the Docker image runs.
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      # Tests use fake HTTP sessions, so CI never depends on a public RPC being up.
      - name: Tests
        run: pytest -q

      - name: Dashboard JSON is generated from the script
        run: python deploy/grafana/build_dashboard.py --check

  # The container image and the Prometheus config must stay valid too.
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Build the watchdog image
        run: docker build -t bsc-pulse:ci .

      - name: Check the Prometheus config and alert rules
        run: >-
          docker run --rm -v "$PWD/deploy/prometheus:/etc/prometheus:ro"
          --entrypoint promtool prom/prometheus:v3.5.0
          check config /etc/prometheus/prometheus.yml

      - name: Unit-test the alert rules
        run: >-
          docker run --rm -v "$PWD/deploy/prometheus:/etc/prometheus:ro"
          --entrypoint promtool prom/prometheus:v3.5.0
          test rules /etc/prometheus/tests/bsc_test.yml

      - name: Check the Alertmanager config
        run: >-
          docker run --rm -v "$PWD/deploy/alertmanager:/etc/alertmanager:ro"
          --entrypoint amtool prom/alertmanager:v0.28.1
          check-config /etc/alertmanager/alertmanager.yml

      - name: Check the Compose file (including the demo profile)
        env:
          GRAFANA_ADMIN_PASSWORD: ci-only-not-a-secret
        run: docker compose --profile demo config --quiet

  # Terraform and Ansible are checked here; they are only applied from a laptop.
  infra:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v4

      - name: Terraform format
        run: terraform -chdir=infra/terraform fmt -check -recursive

      - name: Terraform validate
        run: |
          terraform -chdir=infra/terraform init -backend=false -input=false
          terraform -chdir=infra/terraform validate

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: pip install "ansible>=10,<12" ansible-lint

      - name: Ansible syntax check and lint
        working-directory: infra/ansible
        run: |
          cp inventory/hosts.ini.example inventory/hosts.ini
          ansible-playbook site.yml --syntax-check
          ansible-lint --offline
