# Load every dashboard JSON from the mounted folder. It is generated by
# deploy/grafana/build_dashboard.py, so edits in the Grafana UI are switched off:
# change the script instead, and the change goes through review and git.
apiVersion: 1
providers:
  - name: bsc-pulse
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /etc/grafana/dashboards
