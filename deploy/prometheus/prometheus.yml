# Prometheus config for the Docker Compose stack.
# Service names (bsc-pulse, alertmanager) resolve inside the compose network.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Relative to this file, so it works both in the container and with a local promtool.
rule_files:
  - rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The watchdog sweeps every 5 s, so scrape it at the same rhythm.
  - job_name: bsc-pulse
    scrape_interval: 5s
    static_configs:
      - targets: ["bsc-pulse:9105"]
