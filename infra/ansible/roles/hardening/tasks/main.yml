---
# Reused from eth-node-iac. Only change: the Ethereum P2P firewall rules are gone.
- name: Update apt cache and upgrade packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: safe
    cache_valid_time: 3600

- name: Install baseline packages
  ansible.builtin.apt:
    name: [ufw, fail2ban, unattended-upgrades, curl, jq, htop, dnsutils, tcpdump]
    state: present

- name: Disable SSH password login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config.d/00-hardening.conf
    create: true
    mode: "0644"
    line: "{{ item }}"
    validate: /usr/sbin/sshd -t -f %s   # Never write a config that could lock you out
  loop:
    - "PasswordAuthentication no"
    - "PermitRootLogin no"
  notify: Restart ssh
  # 00- prefix matters: sshd uses the FIRST value it reads, so this must sort before 50-cloud-init.conf

- name: UFW default deny incoming
  community.general.ufw:
    default: deny
    direction: incoming

- name: UFW default allow outgoing
  community.general.ufw:
    default: allow
    direction: outgoing

- name: UFW allow SSH (rate limited)
  community.general.ufw:
    rule: limit
    port: "22"
    proto: tcp

- name: UFW allow extra TCP ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ ufw_allowed_ports_tcp }}"

- name: Enable UFW
  community.general.ufw:
    state: enabled

- name: Enable and start fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
