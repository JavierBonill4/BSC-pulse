---
# Reused from eth-node-iac.
- name: Install Docker from Ubuntu repos
  ansible.builtin.apt:
    name: [docker.io, docker-compose-v2]
    state: present
    update_cache: true

- name: Enable and start Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Let the login user run docker without sudo
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
